  <!-- flag -->
  <path d="M148 74 L182 84 L148 96 Z" fill="#E0457F"/>
  <!-- guiding star -->
  <path d="M300 104 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 Z" fill="#FFE08A"/>
</svg>
<text x="450" y="222" font-family="'DM Serif Display', Georgia, serif" font-size="128" fill="#FFFFFF">Divaha Impex</text>
