<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" width="1240" height="400"><rect width="1240" height="400" fill="#111B4A"/>
<svg x="0" y="0" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/><stop offset=".55" stop-color="#F2A71B"/><stop offset="1" stop-color="#D97A00"/>
    </linearGradient>
    <linearGradient id="dn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24358A"/><stop offset="1" stop-color="#111B4A"/>
    </linearGradient>
    <linearGradient id="dr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0457F"/><stop offset="1" stop-color="#A3134C"/>
    </linearGradient>
    <clipPath id="dc"><circle cx="200" cy="200" r="176"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="196" fill="url(#dn)"/>
  <circle cx="200" cy="200" r="184" fill="none" stroke="url(#dg)" stroke-width="3"/>
  <circle cx="200" cy="200" r="176" fill="none" stroke="#F2A71B" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="2 7"/>
  <g clip-path="url(#dc)">
    <!-- waves -->
    <path d="M10 318 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#5B6FD6" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
    <path d="M-20 342 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#5B6FD6" stroke-opacity=".3" stroke-width="5" stroke-linecap="round"/>
