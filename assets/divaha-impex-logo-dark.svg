  <path d="M206 252 C170 248 160 206 184 180 C200 163 222 156 224 128 C250 152 262 196 244 226 C236 241 222 253 206 252 Z" fill="#162259"/>
  <circle cx="211" cy="215" r="11" fill="url(#dr)"/>
  <circle cx="211" cy="215" r="4" fill="#FFE08A"/>
